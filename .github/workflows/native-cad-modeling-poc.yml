name: NEXO native CAD and modeling PoC

on:
  push:
    branches:
      - spike/ingecad-ingetrazo-native-shell
      - feat/nexo-bridge-cad-model-render
      - feat/cad-layer-change-review
    paths:
      - 'experiments/qt-unified-shell/**'
      - '.github/workflows/native-cad-modeling-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Contract tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DXF read-only inspection dependency
        run: python -m pip install --disable-pip-version-check ezdxf==1.4.2
      - name: Check Python syntax and unit tests
        run: |
          python -m compileall -q experiments/qt-unified-shell
          python -m unittest discover -s experiments/qt-unified-shell -p 'test_*.py' -v

  package-windows:
    name: Windows PoC executable
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled offline Render viewer
        shell: pwsh
        run: |
          npm install --ignore-scripts --no-package-lock
          npx vite build --config experiments/qt-unified-shell/vite.render.config.mjs
          if (!(Test-Path experiments/qt-unified-shell/dist-render/index.html)) { throw "Missing offline Render HTML" }
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check PySide6==6.9.3 pyinstaller==6.16.0 ezdxf==1.4.2
      - name: Validate source
        run: |
          python -m compileall -q experiments/qt-unified-shell
          python -m unittest discover -s experiments/qt-unified-shell -p "test_*.py" -v
      - name: Package PoC shell (editors not bundled)
        shell: pwsh
        run: |
          cd experiments/qt-unified-shell
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name NEXO-Bridge-CAD-Modelado-Render-PoC --add-data "plugins/nexo_live_bridge.py;plugins" --add-data "dist-render;render_web" nexo_shell.py
          if (!(Test-Path dist/NEXO-Bridge-CAD-Modelado-Render-PoC.exe)) { throw "Missing PoC executable" }
      - uses: actions/upload-artifact@v4
        with:
          name: NEXO-Bridge-CAD-Modelado-Render-Windows-PoC
          path: experiments/qt-unified-shell/dist/NEXO-Bridge-CAD-Modelado-Render-PoC.exe
          retention-days: 14
          if-no-files-found: error
