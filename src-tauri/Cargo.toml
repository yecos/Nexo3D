[package]
name = "nexo3d-desktop"
version = "0.1.0-alpha.1"
description = "NEXO 3D - CAD, modelado y render en un solo escritorio"
authors = ["NEXO 3D contributors"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.78"

[build-dependencies]
tauri-build = "2.7.2"

[dependencies]
tauri = "2.12.3"

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
